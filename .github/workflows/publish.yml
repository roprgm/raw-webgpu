name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      VGPU_ADAPTER: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$PRERELEASE" = false
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            test "$PRERELEASE" = true
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/main
      - uses: ./.github/actions/setup
      # prepublishOnly checks formatting, shader pixels and the installed tarball.
      # prepack compiles WASM and TypeScript; the native build reuses its local cache.
      - run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
