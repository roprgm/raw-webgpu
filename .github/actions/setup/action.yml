name: Set up build and tests
description: Install the pinned WASM toolchain and software WebGPU renderers.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.2
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: emscripten-core/emsdk
        ref: 5eb0bde7585670252e8ba05e9d361627bffd08b5 # 6.0.9
        path: .cache/emsdk
        persist-credentials: false
    - name: Install Emscripten
      shell: bash
      run: |
        .cache/emsdk/emsdk install 6.0.9
        .cache/emsdk/emsdk activate 6.0.9
        echo "$GITHUB_WORKSPACE/.cache/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
    - name: Cache native build
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .cache/native
          dist/libraw.js
          dist/libraw.wasm
        key: ${{ runner.os }}-${{ runner.arch }}-native-v1-${{ hashFiles('native/build.py', 'native/*.patch') }}-${{ hashFiles('native/*.cpp', 'native/*.h') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-native-v1-${{ hashFiles('native/build.py', 'native/*.patch') }}-
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Install test renderers
      shell: bash
      run: |
        bunx --no-install playwright install --with-deps chromium
        bunx --no-install vgpu install-software-renderer
        for icd in "$HOME"/.cache/vgpu/software-renderer/*/linux-x64/lvp_icd.json; do
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
        done
